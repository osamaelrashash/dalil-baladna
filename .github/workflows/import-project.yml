name: Import project ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.event.head_commit.message != 'Import project from ZIP' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ZIP from Google Drive
        run: |
          curl -L --fail --retry 3 "https://drive.usercontent.google.com/download?id=1M2R9dVj8QX4S3Mqy1sUicuV5N9yfppLB&export=download&confirm=t" -o project.zip
          unzip -l project.zip | head -30

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q project.zip -d extracted
          root="extracted/baladna"
          if [ ! -f "$root/package.json" ]; then
            echo "package.json not found"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi
          rm -rf "$root/.git"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$root"/. .
          rm -f project.zip
          rm -rf extracted

      - name: Remove secrets
        run: |
          rm -f .env .env.local
          find . -name ".env" -o -name ".env.local" | xargs -r rm -f

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import project from ZIP" || echo "No changes"
          git push
